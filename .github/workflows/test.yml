name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/test_keeper.py
      - run: python scripts/test_quota.py
      - run: python scripts/test_deployment.py
      - run: python scripts/test_release.py
      - name: Isolated installation acceptance and recovery demo
        run: python scripts/acceptance.py --report acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-${{ matrix.python }}
          path: acceptance.json
          if-no-files-found: error
          overwrite: true
